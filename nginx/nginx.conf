# ComplyNexus edge reverse proxy.
#   /        -> frontend SPA container
#   /api/*   -> backend FastAPI container
upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # Generous timeouts: the agent can take a while (multi-hop tool calls + LLM).
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    client_max_body_size 10m;

    # API -> backend. Keep the /api prefix (backend mounts routes under /api).
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # stream responses promptly
    }

    # Everything else -> SPA.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
